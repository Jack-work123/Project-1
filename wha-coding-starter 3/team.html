<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 24px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #666;
      margin-bottom: 40px;
    }
    .team-grid {
      display: grid;
      gap: 16px;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .name {
      font-weight: 600;
      font-size: 1rem;
    }
    .role {
      color: #6b7280;
      font-size: 0.9rem;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h1>Our Team</h1>
  <p class="subtitle">The people building this product.</p>

  <div class="team-grid">
    <div class="card">
      <div class="avatar">👩‍💼</div>
      <div>
        <div class="name">Sarah Chen</div>
        <div class="role">Chief Executive Officer</div>
      </div>
    </div>
    <div class="card">
      <div class="avatar">👨‍💻</div>
      <div>
        <div class="name">Marcus Johnson</div>
        <div class="role">Head of Engineering</div>
      </div>
    </div>
    <div class="card">
      <div class="avatar">👩‍🎨</div>
      <div>
        <div class="name">Priya Patel</div>
        <div class="role">Product Designer</div>
      </div>
    </div>
    <div class="card">
      <div class="avatar">👨‍📊</div>
      <div>
        <div class="name">David Okafor</div>
        <div class="role">Head of Operations</div>
      </div>
    </div>
    <div class="card">
      <div class="avatar">👩‍🔬</div>
      <div>
        <div class="name">Lena Müller</div>
        <div class="role">Data Analyst</div>
      </div>
    </div>
  </div>
</body>
</html>
