<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Breakdown — Egg Growing Group</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232635;
    --border: #2e3148;
    --text: #e8eaf0;
    --muted: #8b8fa8;
    --ww: #00a651;
    --coles: #e8192c;
    --ind: #f5a623;
    --other: #6c7adb;
    --total: #4fc3f7;
    --positive: #34d399;
    --negative: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

  /* HEADER */
  .header { padding: 20px 28px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .header-top h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header-top .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* CONTROLS ROW */
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; }
  .btn-group { display: flex; background: var(--bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .btn-group button { padding: 6px 14px; background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; transition: all .15s; }
  .btn-group button.active { background: var(--surface2); color: var(--text); font-weight: 600; }
  .btn-group button:hover:not(.active) { color: var(--text); }

  .channel-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .channel-btn { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; border: 1.5px solid; background: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s; }
  .channel-btn .dot { width: 8px; height: 8px; border-radius: 50%; }
  .channel-btn.active { background: rgba(255,255,255,.08); }
  .channel-btn:not(.active) { opacity: 0.45; }

  .divider { width: 1px; height: 24px; background: var(--border); }

  /* COMPARE SECTION */
  .compare-wrap { display: flex; align-items: center; gap: 8px; }
  .compare-wrap label { color: var(--muted); font-size: 12px; }
  .compare-wrap select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

  /* MAIN */
  .main { padding: 20px 28px; }

  /* KPI CARDS */
  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .kpi-card .value { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .kpi-card .change { font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .kpi-card .change.up { color: var(--positive); }
  .kpi-card .change.down { color: var(--negative); }
  .kpi-card .change.neutral { color: var(--muted); }
  .kpi-card .vs-label { font-size: 11px; color: var(--muted); }

  /* CHARTS ROW */
  .charts-row { display: grid; grid-template-columns: 1fr 280px; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart-card h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 14px; }
  .chart-container { position: relative; }

  /* COMPARISON CHART */
  .compare-chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; display: none; }
  .compare-chart-wrap.visible { display: block; }
  .compare-chart-wrap h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 14px; }

  /* TABLE */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .table-card h3 { font-size: 13px; font-weight: 600; color: var(--muted); padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { padding: 10px 14px; text-align: right; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 10px 14px; text-align: right; white-space: nowrap; }
  tbody td:first-child { text-align: left; color: var(--muted); }
  .bar-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .mini-bar { height: 6px; border-radius: 3px; min-width: 2px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .badge.up { background: rgba(52,211,153,.15); color: var(--positive); }
  .badge.down { background: rgba(248,113,113,.15); color: var(--negative); }

  /* COLOR ACCENT BORDERS */
  .kpi-card.ww { border-top: 3px solid var(--ww); }
  .kpi-card.coles { border-top: 3px solid var(--coles); }
  .kpi-card.ind { border-top: 3px solid var(--ind); }
  .kpi-card.other { border-top: 3px solid var(--other); }
  .kpi-card.total { border-top: 3px solid var(--total); }

  .no-data { padding: 40px; text-align: center; color: var(--muted); }

  /* PERIOD NAVIGATOR */
  .period-nav { display: flex; align-items: center; gap: 8px; }
  .period-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .period-nav button:hover { color: var(--text); border-color: var(--muted); }
  .period-nav .period-label { font-size: 13px; color: var(--text); min-width: 120px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>Revenue Breakdown</h1>
      <div class="subtitle">Egg Growing Group Pty Ltd &nbsp;·&nbsp; Business Weekly Scorecard</div>
    </div>
    <div class="period-nav">
      <button id="prevBtn" title="Previous period">&#8249;</button>
      <span class="period-label" id="periodLabel">All time</span>
      <button id="nextBtn" title="Next period">&#8250;</button>
    </div>
  </div>

  <div class="controls">
    <!-- Period granularity -->
    <div class="btn-group" id="granGroup">
      <button data-gran="weekly" class="active">Weekly</button>
      <button data-gran="monthly">Monthly</button>
      <button data-gran="yearly">Yearly</button>
    </div>

    <div class="divider"></div>

    <!-- Channel filters -->
    <div class="channel-filters">
      <button class="channel-btn active" data-ch="all" style="border-color:var(--text);color:var(--text)">
        <span class="dot" style="background:var(--text)"></span> All
      </button>
      <button class="channel-btn active" data-ch="woolies" style="border-color:var(--ww);color:var(--ww)">
        <span class="dot" style="background:var(--ww)"></span> Woolworths
      </button>
      <button class="channel-btn active" data-ch="coles" style="border-color:var(--coles);color:var(--coles)">
        <span class="dot" style="background:var(--coles)"></span> Coles
      </button>
      <button class="channel-btn active" data-ch="ind" style="border-color:var(--ind);color:var(--ind)">
        <span class="dot" style="background:var(--ind)"></span> Independents
      </button>
      <button class="channel-btn active" data-ch="other" style="border-color:var(--other);color:var(--other)">
        <span class="dot" style="background:var(--other)"></span> Other
      </button>
    </div>

    <div class="divider"></div>

    <!-- Compare -->
    <div class="compare-wrap">
      <label>Compare to:</label>
      <select id="compareSelect">
        <option value="none">None</option>
        <option value="prev">Previous period</option>
        <option value="prevyear">Previous year</option>
      </select>
    </div>
  </div>
</div>

<div class="main">
  <!-- KPI CARDS -->
  <div class="kpi-grid">
    <div class="kpi-card total">
      <div class="label">Total Revenue</div>
      <div class="value" id="kpi-total">—</div>
      <div class="change neutral" id="kpi-total-chg"></div>
      <div class="vs-label" id="kpi-total-vs"></div>
    </div>
    <div class="kpi-card ww">
      <div class="label">Woolworths</div>
      <div class="value" id="kpi-ww">—</div>
      <div class="change neutral" id="kpi-ww-chg"></div>
      <div class="vs-label" id="kpi-ww-pct"></div>
    </div>
    <div class="kpi-card coles">
      <div class="label">Coles</div>
      <div class="value" id="kpi-coles">—</div>
      <div class="change neutral" id="kpi-coles-chg"></div>
      <div class="vs-label" id="kpi-coles-pct"></div>
    </div>
    <div class="kpi-card ind">
      <div class="label">Independents</div>
      <div class="value" id="kpi-ind">—</div>
      <div class="change neutral" id="kpi-ind-chg"></div>
      <div class="vs-label" id="kpi-ind-pct"></div>
    </div>
    <div class="kpi-card other">
      <div class="label">Other / Untracked</div>
      <div class="value" id="kpi-other">—</div>
      <div class="change neutral" id="kpi-other-chg"></div>
      <div class="vs-label" id="kpi-other-pct"></div>
    </div>
  </div>

  <!-- MAIN CHARTS ROW -->
  <div class="charts-row">
    <div class="chart-card">
      <h3 id="mainChartTitle">Revenue by Channel</h3>
      <div class="chart-container" style="height:280px">
        <canvas id="mainChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>Channel Mix</h3>
      <div class="chart-container" style="height:280px">
        <canvas id="donutChart"></canvas>
      </div>
    </div>
  </div>

  <!-- COMPARISON CHART (shown when compare selected) -->
  <div class="compare-chart-wrap" id="compareChartWrap">
    <h3 id="compareChartTitle">Period Comparison</h3>
    <div class="chart-container" style="height:240px">
      <canvas id="compareChart"></canvas>
    </div>
  </div>

  <!-- DATA TABLE -->
  <div class="table-card">
    <h3 id="tableTitle">Weekly Detail</h3>
    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

// ── Data aggregation ───────────────────────────────────────────────
function aggregateData(records, granularity) {
  const map = new Map();
  records.forEach(r => {
    const d = new Date(r.date);
    let key, label;
    if (granularity === 'weekly') {
      key = r.date;
      label = r.period.split(/\s{2,}/)[0].trim();
    } else if (granularity === 'monthly') {
      key = `${r.year}-${String(r.month).padStart(2,'0')}`;
      label = new Date(r.year, r.month-1, 1).toLocaleString('default', {month:'short', year:'numeric'});
    } else {
      key = String(r.year);
      label = String(r.year);
    }
    if (!map.has(key)) map.set(key, { key, label, total:0, woolies:0, coles:0, ind:0, other:0, boxes:0 });
    const e = map.get(key);
    e.total   += r.total;
    e.woolies += r.woolies;
    e.coles   += r.coles;
    e.ind     += r.ind;
    e.other   += r.other;
    e.boxes   += r.total_boxes;
  });
  return Array.from(map.values());
}

function getAggregated() {
  return aggregateData(RAW, gran);
}

  const maxOffset = Math.ceil(total / PAGE) - 1;
  const offset = Math.max(0, Math.min(maxOffset, maxOffset - periodOffset));
  const start = offset * PAGE;
  return all.slice(start, start + PAGE);
}

function getPeriodLabel(visible) {
  if (!visible.length) return '';
  if (gran === 'yearly') return 'All Years';
  return `${visible[0].label} – ${visible[visible.length-1].label}`;
}

// ── Formatting ─────────────────────────────────────────────────────
function fmtMoney(v) {
  if (v >= 1e6) return `$${(v/1e6).toFixed(2)}M`;
  if (v >= 1e3) return `$${(v/1e3).toFixed(1)}K`;
  return `$${Math.round(v).toLocaleString()}`;
}
function fmtPct(v) { return `${(v*100).toFixed(1)}%`; }
function fmtChange(curr, prev) {
  if (!prev || prev === 0) return null;
  return (curr - prev) / prev;
}

// ── KPI cards ──────────────────────────────────────────────────────
function updateKPIs(visible, prev) {
  const sum = (arr, key) => arr.reduce((a,b) => a + b[key], 0);
  const total   = sum(visible, 'total');
  const woolies = sum(visible, 'woolies');
  const coles   = sum(visible, 'coles');
  const ind     = sum(visible, 'ind');
  const other   = sum(visible, 'other');

  const pTotal   = prev ? sum(prev, 'total')   : null;
  const pWoolies = prev ? sum(prev, 'woolies')  : null;
  const pColes   = prev ? sum(prev, 'coles')    : null;
  const pInd     = prev ? sum(prev, 'ind')      : null;
  const pOther   = prev ? sum(prev, 'other')    : null;

  function setKPI(id, val, prevVal, pctOfTotal) {
    document.getElementById(`kpi-${id}`).textContent = fmtMoney(val);
    const chgEl = document.getElementById(`kpi-${id}-chg`);
    const pctEl = document.getElementById(`kpi-${id}-pct`);
    const vsEl  = document.getElementById(`kpi-${id}-vs`);
    const chg = fmtChange(val, prevVal);
    if (chg !== null) {
      const up = chg >= 0;
      chgEl.className = `change ${up ? 'up' : 'down'}`;
      chgEl.textContent = `${up?'▲':'▼'} ${fmtPct(Math.abs(chg))} vs prev`;
    } else {
      chgEl.className = 'change neutral';
      chgEl.textContent = '';
    }
    if (pctEl) pctEl.textContent = total > 0 ? `${fmtPct(pctOfTotal / total)} of revenue` : '';
    if (vsEl)  vsEl.textContent  = prevVal ? `vs ${fmtMoney(prevVal)}` : '';
  }

  document.getElementById('kpi-total').textContent = fmtMoney(total);
  const totalChg = fmtChange(total, pTotal);
  const el = document.getElementById('kpi-total-chg');
  if (totalChg !== null) {
    el.className = `change ${totalChg >= 0 ? 'up' : 'down'}`;
    el.textContent = `${totalChg >= 0 ? '▲' : '▼'} ${fmtPct(Math.abs(totalChg))} vs prev`;
  } else {
    el.className = 'change neutral'; el.textContent = '';
  }
  const vsEl = document.getElementById('kpi-total-vs');
  if (vsEl) vsEl.textContent = pTotal ? `vs ${fmtMoney(pTotal)}` : '';

  setKPI('ww',    woolies, pWoolies, woolies);
  setKPI('coles', coles,   pColes,   coles);
  setKPI('ind',   ind,     pInd,     ind);
  setKPI('other', other,   pOther,   other);
}

// ── Main bar/line chart ────────────────────────────────────────────
function buildMainChart(visible, prev) {
  const labels = visible.map(d => d.label);
  const channels = ['woolies','coles','ind','other'].filter(c => activeChannels.has(c));

  const datasets = channels.map(c => ({
    label: LABELS[c],
    data: visible.map(d => d[c]),
    backgroundColor: COLORS[c],
    borderColor: COLORS[c],
    borderRadius: 3,
    borderSkipped: false,
  }));

  if (prev && channels.length > 0) {
    // overlay dashed total line for prev
    datasets.push({
      label: 'Prev Period Total',
      data: prev.map(d => d.total),
      type: 'line',
      borderColor: 'rgba(255,255,255,0.3)',
      borderDash: [4,3],
      borderWidth: 1.5,
      pointRadius: 0,
      fill: false,
      tension: 0.3,
      yAxisID: 'y',
    });
  }

  const ctx = document.getElementById('mainChart').getContext('2d');
  if (mainChart) mainChart.destroy();
  mainChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { color: '#8b8fa8', font: { size: 11 }, boxWidth: 10, padding: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtMoney(ctx.raw)}`,
            footer: items => {
              const total = items.reduce((s,i) => s + (typeof i.raw === 'number' ? i.raw : 0), 0);
              return items.length > 1 ? `Total: ${fmtMoney(total)}` : '';
            }
          }
        }
      },
      scales: {
        x: { stacked: true, ticks: { color: '#8b8fa8', maxRotation: 45, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { stacked: true, ticks: { color: '#8b8fa8', callback: v => fmtMoney(v), font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
      }
    }
  });
}

// ── Donut chart ────────────────────────────────────────────────────
function buildDonutChart(visible) {
  const sum = key => visible.reduce((a,b) => a + b[key], 0);
  const channels = ['woolies','coles','ind','other'].filter(c => activeChannels.has(c));
  const vals = channels.map(c => sum(c));
  const total = vals.reduce((a,b) => a+b, 0);

  const ctx = document.getElementById('donutChart').getContext('2d');
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: channels.map(c => LABELS[c]),
      datasets: [{ data: vals, backgroundColor: channels.map(c => COLORS[c]), borderWidth: 2, borderColor: '#1a1d27', hoverOffset: 6 }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '68%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#8b8fa8', font: { size: 11 }, padding: 10, boxWidth: 10 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmtMoney(ctx.raw)} (${fmtPct(ctx.raw/total)})` } }
      }
    }
  });
}

// ── Comparison chart ───────────────────────────────────────────────
function buildCompareChart(current, prev) {
  if (!prev || compareMode === 'none') {
    document.getElementById('compareChartWrap').classList.remove('visible');
    if (compareChart) { compareChart.destroy(); compareChart = null; }
    return;
  }
  document.getElementById('compareChartWrap').classList.add('visible');

  const len = Math.min(current.length, prev.length);
  const labels = current.slice(0, len).map(d => d.label);

  const currTotals = current.slice(0, len).map(d => d.total);
  const prevTotals = prev.slice(0, len).map(d => d.total);

  const ctx = document.getElementById('compareChart').getContext('2d');
  if (compareChart) compareChart.destroy();
  compareChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Current', data: currTotals, backgroundColor: 'rgba(79,195,247,0.7)', borderRadius: 3 },
        { label: compareMode === 'prevyear' ? 'Prior Year' : 'Prior Period', data: prevTotals, backgroundColor: 'rgba(255,255,255,0.12)', borderRadius: 3 },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8b8fa8', font: { size: 11 }, boxWidth: 10 } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtMoney(ctx.raw)}`,
            afterBody: items => {
              if (items.length >= 1) {
                const curr = items.find(i => i.datasetIndex === 0)?.raw || 0;
                const prev = items.find(i => i.datasetIndex === 1)?.raw || 0;
                if (prev > 0) return [`Δ ${fmtPct((curr-prev)/prev)}`];
              }
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#8b8fa8', font: { size: 10 }, maxRotation: 45 }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { ticks: { color: '#8b8fa8', callback: v => fmtMoney(v), font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
      }
    }
  });
}

// ── Table ──────────────────────────────────────────────────────────
function buildTable(visible, prev) {
  const channels = ['woolies','coles','ind','other'].filter(c => activeChannels.has(c));
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');

  head.innerHTML = `<tr>
    <th>Period</th>
    <th>Total Revenue</th>
    ${channels.map(c => `<th>${LABELS[c]}</th>`).join('')}
    ${channels.map(c => `<th>${LABELS[c]} %</th>`).join('')}
    ${prev ? '<th>vs Prev</th>' : ''}
    <th>Boxes</th>
  </tr>`;

  body.innerHTML = visible.map((d, i) => {
    const pRow = prev ? prev[i] : null;
    const chg = pRow ? fmtChange(d.total, pRow.total) : null;
    const pctBar = key => {
      const pct = d.total > 0 ? (d[key] / d.total * 100) : 0;
      return `<div class="bar-cell"><div class="mini-bar" style="width:${Math.max(2,pct)}px;background:${COLORS[key]}"></div>${fmtPct(pct/100)}</div>`;
    };
    return `<tr>
      <td>${d.label}</td>
      <td>${fmtMoney(d.total)}</td>
      ${channels.map(c => `<td>${fmtMoney(d[c])}</td>`).join('')}
      ${channels.map(c => `<td>${pctBar(c)}</td>`).join('')}
      ${pRow ? `<td><span class="badge ${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${fmtPct(Math.abs(chg))}</span></td>` : ''}
      <td>${(d.boxes||0).toLocaleString()}</td>
    </tr>`;
  }).join('');
}

// ── Previous period data ───────────────────────────────────────────
function getPrevData(all, visible) {
  if (compareMode === 'none') return null;

  if (compareMode === 'prevyear' && gran === 'yearly') {
    // Already yearly — shift each year back by 1
    return null; // not meaningful
  }

  if (compareMode === 'prevyear') {
    // Get same periods but 1 year earlier
    const visibleKeys = new Set(visible.map(d => d.key));
    const prevYear = aggregateData(
      RAW.map(r => ({ ...r, year: r.year + 1, date: r.date.replace(/^\d{4}/, String(r.year + 1)) })),
      gran
    );
    return prevYear.filter(d => visibleKeys.has(d.key));
  }

  if (compareMode === 'prev') {
    const idx = all.findIndex(d => d.key === visible[0].key);
    if (idx < visible.length) return null;
    return all.slice(idx - visible.length, idx);
  }
  return null;
}

// ── Main render ────────────────────────────────────────────────────
function render() {
  const all = getAggregated();
  const visible = getVisibleData(all);
  const prev = getPrevData(all, visible);

  document.getElementById('periodLabel').textContent = getPeriodLabel(visible);
  document.getElementById('mainChartTitle').textContent = `Revenue by Channel (${gran.charAt(0).toUpperCase()+gran.slice(1)})`;
  document.getElementById('tableTitle').textContent = gran.charAt(0).toUpperCase()+gran.slice(1)+' Detail';
  document.getElementById('compareChartTitle').textContent =
    compareMode === 'prevyear' ? 'Current vs Prior Year' : 'Current vs Prior Period';

  updateKPIs(visible, prev);
  buildMainChart(visible, prev);
  buildDonutChart(visible);
  buildCompareChart(visible, prev);
  buildTable(visible, prev);

  // Prev/next nav
  const PAGE = gran === 'weekly' ? 26 : 18;
  const maxOffset = gran === 'yearly' ? 0 : Math.ceil(all.length / PAGE) - 1;
  document.getElementById('prevBtn').disabled = periodOffset >= maxOffset;
  document.getElementById('nextBtn').disabled = periodOffset <= 0;
}

// ── Event listeners ────────────────────────────────────────────────
document.querySelectorAll('#granGroup button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#granGroup button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gran = btn.dataset.gran;
    periodOffset = 0;
    render();
  });
});

document.querySelectorAll('.channel-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const ch = btn.dataset.ch;
    if (ch === 'all') {
      const allActive = activeChannels.size === 4;
      if (allActive) {
        activeChannels.clear();
      } else {
        activeChannels = new Set(['woolies','coles','ind','other']);
      }
    } else {
      if (activeChannels.has(ch)) activeChannels.delete(ch);
      else activeChannels.add(ch);
    }
    document.querySelectorAll('.channel-btn').forEach(b => {
      if (b.dataset.ch === 'all') {
        b.classList.toggle('active', activeChannels.size === 4);
      } else {
        b.classList.toggle('active', activeChannels.has(b.dataset.ch));
      }
    });
    render();
  });
});

document.getElementById('compareSelect').addEventListener('change', e => {
  compareMode = e.target.value;
  render();
});

document.getElementById('prevBtn').addEventListener('click', () => { periodOffset++; render(); });
document.getElementById('nextBtn').addEventListener('click', () => { if (periodOffset > 0) { periodOffset--; render(); } });

// Initial render
render();
</script>
</body>
